# Local TEST stack only (ADR-0002/0004). Nothing here serves the website:
# no ports are published. Start it with `python scripts/task.py up`.
name: harari-test

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: harari
      MYSQL_USER: harari
      MYSQL_PASSWORD: secret
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 40

  app:
    image: harari-php:test
    build:
      context: docker
      dockerfile: php.Dockerfile
      target: base
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: harari_test
      DB_USERNAME: harari
      DB_PASSWORD: secret
    volumes:
      - .:/app
      # vendor lives in a named volume: much faster than the Windows bind mount
      - vendor:/app/vendor
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  vendor:
